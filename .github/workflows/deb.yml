name: deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Build on the oldest supported target (glibc 2.36): the packages then
    # install on Debian 12+ and Ubuntu 24.04+.
    container: debian:bookworm
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git dpkg-dev lintian xz-utils

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build web UI
        run: npm --prefix web ci && npm --prefix web run build

      - name: Package version
        id: version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version"
              exit 1
            fi
            deb_version="$cargo_version-1"
          else
            # sorts before the release of the same version
            deb_version="${cargo_version}~ci${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}-1"
          fi
          echo "deb=$deb_version" >> "$GITHUB_OUTPUT"
          echo "package version: $deb_version"

      - name: Build packages
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb }}
        run: packaging/deb/build.sh

      - name: Inspect packages
        shell: bash
        run: |
          for deb in target/debian/*.deb; do
            echo "::group::$deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            echo "::endgroup::"
          done

      - name: Lintian
        continue-on-error: true
        run: lintian --info --display-info target/debian/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
