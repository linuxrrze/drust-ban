[package]
name = "df2b-agent"
description = "dist-f2b agent: log ingestion, detection and local countermeasures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["journald"]
journald = ["df2b-sources/journald"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
df2b-core.workspace = true
df2b-firewall.workspace = true
df2b-matcher.workspace = true
df2b-proto.workspace = true
df2b-sources.workspace = true
df2b-tls.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
glob.workspace = true
ipnet.workspace = true
libc.workspace = true
prost.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Debian package (cargo-deb); build with packaging/deb/build.sh, which
# generates packaging/deb/generated/agent.toml from config/agent.example.toml.
# The df2b user comes from the sysusers.d file (cargo-deb adds the postinst).
[package.metadata.deb]
maintainer = "Marcel Ritter <marcel@linux-ng.de>"
section = "net"
priority = "optional"
extended-description = """\
Reads logs (files and the systemd journal), detects abusive clients with \
fail2ban-style filters and bans them with nftables, standalone or together \
with a dist-f2b controller."""
depends = "$auto, nftables"
recommends = "df2bctl, libsystemd0"
maintainer-scripts = "../../packaging/deb/df2b-agent/"
systemd-units = { unit-scripts = "../../packaging/systemd", enable = true, start = true }
assets = [
    ["target/release/df2b-agent", "usr/bin/", "755"],
    ["../../packaging/deb/generated/agent.toml", "etc/df2b/agent.toml", "644"],
    ["../../filters/*.toml", "etc/df2b/filters/", "644"],
    ["../../packaging/deb/df2b-agent.sysusers", "usr/lib/sysusers.d/df2b-agent.conf", "644"],
    ["../../README.md", "usr/share/doc/df2b-agent/README.md", "644"],
    ["../../config/agent.example.toml", "usr/share/doc/df2b-agent/examples/agent.example.toml", "644"],
]

# RPM package (cargo-generate-rpm); build with packaging/rpm/build.sh, which
# generates target/rpm/agent.toml and the stripped binaries in target/rpm/bin/.
# Paths are relative to the workspace root. The df2b user comes from the
# sysusers.d file (systemd-sysusers in %post).
[package.metadata.generate-rpm]
# no license declared for the project yet (RPM requires the tag)
license = "LicenseRef-Unspecified"
release = "1"
assets = [
    { source = "target/rpm/bin/df2b-agent", dest = "/usr/bin/df2b-agent", mode = "755" },
    { source = "target/rpm/agent.toml", dest = "/etc/df2b/agent.toml", mode = "644", config = "noreplace" },
    { source = "filters/*.toml", dest = "/etc/df2b/filters/", mode = "644", config = "noreplace" },
    { source = "packaging/systemd/df2b-agent.service", dest = "/usr/lib/systemd/system/df2b-agent.service", mode = "644" },
    { source = "packaging/deb/df2b-agent.sysusers", dest = "/usr/lib/sysusers.d/df2b-agent.conf", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/df2b-agent/README.md", mode = "644", doc = true },
    { source = "config/agent.example.toml", dest = "/usr/share/doc/df2b-agent/examples/agent.example.toml", mode = "644", doc = true },
]
post_install_script = "packaging/rpm/df2b-agent/post"
pre_uninstall_script = "packaging/rpm/df2b-agent/preun"
post_uninstall_script = "packaging/rpm/df2b-agent/postun"

[package.metadata.generate-rpm.requires]
nftables = "*"
systemd = "*"

[package.metadata.generate-rpm.recommends]
df2bctl = "*"
