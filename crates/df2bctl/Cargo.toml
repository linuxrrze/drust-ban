[package]
name = "df2bctl"
description = "dist-f2b command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
df2b-tls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
df2b-core.workspace = true
df2b-matcher.workspace = true
humantime.workspace = true
ipnet.workspace = true

# Debian package (cargo-deb); build with packaging/deb/build.sh.
[package.metadata.deb]
maintainer = "Marcel Ritter <marcel@linux-ng.de>"
section = "net"
priority = "optional"
extended-description = """\
Command line tool for dist-f2b: talks to the controller's REST API, or with \
--local to the agent on this host; also tests filters against log files."""
depends = "$auto"
assets = [
    ["target/release/df2bctl", "usr/bin/", "755"],
]

# RPM package (cargo-generate-rpm); build with packaging/rpm/build.sh.
[package.metadata.generate-rpm]
# no license declared for the project yet (RPM requires the tag)
license = "LicenseRef-Unspecified"
release = "1"
assets = [
    { source = "target/rpm/bin/df2bctl", dest = "/usr/bin/df2bctl", mode = "755" },
]
