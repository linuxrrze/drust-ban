[package]
name = "df2bctl"
description = "dist-f2b command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
df2b-tls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
df2b-core.workspace = true
df2b-matcher.workspace = true
humantime.workspace = true
ipnet.workspace = true

# Debian package (cargo-deb); build with packaging/deb/build.sh.
[package.metadata.deb]
maintainer = "Marcel Ritter <marcel@linux-ng.de>"
copyright = "2026 Marcel Ritter"
license-file = ["../../packaging/deb/generated/LICENSE.dep5", "2"]
section = "net"
priority = "optional"
extended-description = """\
Command line tool for dist-f2b: talks to the controller's REST API, or with \
--local to the agent on this host; also tests filters against log files."""
depends = "$auto"
assets = [
    ["target/release/df2bctl", "usr/bin/", "755"],
    ["../../packaging/deb/generated/THIRD-PARTY-LICENSES", "usr/share/doc/df2bctl/", "644"],
]

# RPM package (cargo-generate-rpm); build with packaging/rpm/build.sh.
[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/rpm/bin/df2bctl", dest = "/usr/bin/df2bctl", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/df2bctl/LICENSE", mode = "644", doc = true },
    { source = "target/rpm/THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/df2bctl/THIRD-PARTY-LICENSES", mode = "644", doc = true },
]
