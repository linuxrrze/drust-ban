[package]
name = "df2b-controller"
description = "dist-f2b controller: decision log, correlation, REST API and web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
chrono.workspace = true
glob.workspace = true
clap.workspace = true
df2b-core.workspace = true
df2b-matcher.workspace = true
df2b-proto.workspace = true
df2b-tls.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
libc.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
redb.workspace = true
maxminddb.workspace = true
ring.workspace = true
rpassword.workspace = true
rust-embed.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]

# Debian package (cargo-deb); build with packaging/deb/build.sh (the web UI
# in web/dist must be built first, it is embedded into the binary).
[package.metadata.deb]
maintainer = "Marcel Ritter <marcel@linux-ng.de>"
copyright = "2026 Marcel Ritter"
license-file = ["../../packaging/deb/generated/LICENSE.dep5", "2"]
section = "net"
priority = "optional"
extended-description = """\
Central decision log, correlation, enrollment CA, REST API and web UI for \
dist-f2b agents."""
depends = "$auto"
recommends = "df2bctl"
maintainer-scripts = "../../packaging/deb/df2b-controller/"
systemd-units = { unit-scripts = "../../packaging/systemd", enable = true, start = true }
assets = [
    ["target/release/df2b-controller", "usr/bin/", "755"],
    ["../../packaging/deb/generated/THIRD-PARTY-LICENSES", "usr/share/doc/df2b-controller/", "644"],
    ["../../README.md", "usr/share/doc/df2b-controller/README.md", "644"],
    ["../../config/oidc.example.toml", "usr/share/doc/df2b-controller/examples/oidc.example.toml", "644"],
]

# RPM package (cargo-generate-rpm); build with packaging/rpm/build.sh (the
# web UI in web/dist must be built first, it is embedded into the binary).
# Paths are relative to the workspace root.
[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/rpm/bin/df2b-controller", dest = "/usr/bin/df2b-controller", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/df2b-controller/LICENSE", mode = "644", doc = true },
    { source = "target/rpm/THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/df2b-controller/THIRD-PARTY-LICENSES", mode = "644", doc = true },
    { source = "packaging/systemd/df2b-controller.service", dest = "/usr/lib/systemd/system/df2b-controller.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/df2b-controller/README.md", mode = "644", doc = true },
    { source = "config/oidc.example.toml", dest = "/usr/share/doc/df2b-controller/examples/oidc.example.toml", mode = "644", doc = true },
]
post_install_script = "packaging/rpm/df2b-controller/post"
pre_uninstall_script = "packaging/rpm/df2b-controller/preun"
post_uninstall_script = "packaging/rpm/df2b-controller/postun"

[package.metadata.generate-rpm.requires]
systemd = "*"

[package.metadata.generate-rpm.recommends]
df2bctl = "*"
