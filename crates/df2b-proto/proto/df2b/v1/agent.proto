// Agent <-> controller protocol. Transport: gRPC over mTLS.
// The agent identity is taken from the client certificate, never from
// message fields (except during Enroll, which is authenticated by token).
syntax = "proto3";

package df2b.v1;

service AgentService {
  // Exchange a one-time enrollment token + CSR for a signed client cert.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Replace the agent certificate before it expires (authenticated by the
  // current certificate; the previous one stays valid until first use of the
  // new one, so a lost response cannot lock the agent out).
  rpc Renew(RenewRequest) returns (RenewResponse);

  // Periodic liveness + health; drives the "connected clients" view.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Batched observations (failures per key/jail) for central correlation.
  rpc Report(ObservationBatch) returns (ReportAck);

  // Decision log stream, resumable from the last applied sequence number.
  rpc Subscribe(SubscribeRequest) returns (stream DecisionEvent);
}

// ---------------------------------------------------------------- enrollment

message EnrollRequest {
  string token = 1;
  string hostname = 2;
  bytes csr_der = 3;
  string agent_version = 4;
}

message EnrollResponse {
  string agent_id = 1;
  bytes certificate_der = 2;
  bytes ca_certificate_der = 3;
  // Group assigned by the enrollment token.
  string group = 4;
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  bytes certificate_der = 1;
  bytes ca_certificate_der = 2;
}

// ----------------------------------------------------------------- heartbeat

message SourceStatus {
  string name = 1;
  uint64 lines_per_second = 2;
  // How far behind the newest log entry the source is, in milliseconds.
  uint64 lag_ms = 3;
  string error = 4;
}

message HeartbeatRequest {
  string agent_version = 1;
  int64 agent_time_unix_ms = 2;
  repeated SourceStatus sources = 3;
  uint64 active_bans = 4;
  string firewall_backend = 5;
  bool firewall_healthy = 6;
  uint64 last_applied_seq = 7;
  // Version of the central allowlist the agent applies ("" = none / old agent).
  string allowlist_version = 8;
  // The agent's jails with their effective settings.
  repeated JailStatus jails = 9;
  // Version of the jail policies the agent applies ("" = none / old agent).
  string jail_policies_version = 10;
  // Version of the central jail definitions the agent applies.
  string central_jails_version = 11;
  // Version of the central redaction rules the agent applies ("off" = the
  // agent does not accept them, "" = none / old agent).
  string redaction_version = 12;
}

message JailStatus {
  string name = 1;
  string filter = 2;
  bool enabled = 3;
  uint32 maxretry = 4;
  int64 findtime_ms = 5;
  int64 bantime_ms = 6;
  double bantime_factor = 7;
  // 0 = no maximum
  int64 max_bantime_ms = 8;
  // Settings that come from a central policy, e.g. "maxretry".
  repeated string overridden = 9;
  uint64 active_bans = 10;
  // "local" (agent configuration) or "central" (controller definition).
  string origin = 11;
  // Why a central jail does not run (conflict, path not allowed, ...).
  string error = 12;
}

message HeartbeatResponse {
  int64 controller_time_unix_ms = 1;
  // Groups the controller has assigned to this agent.
  repeated string groups = 2;
}

// -------------------------------------------------------------- observations

message Observation {
  // Normalized prefix, e.g. "203.0.113.7/32" or "2001:db8::/64".
  string key = 1;
  string jail = 2;
  uint32 count = 3;
  int64 first_seen_unix_ms = 4;
  int64 last_seen_unix_ms = 5;
  // Optional sample log line (may be dropped by privacy settings).
  string sample = 6;
  // Set when this observation caused a local ban.
  bool locally_banned = 7;
  int64 local_ban_expires_unix_ms = 8;
}

message ObservationBatch {
  repeated Observation observations = 1;
}

message ReportAck {
  uint32 accepted = 1;
  // Non-zero if the agent is being rate limited.
  uint32 retry_after_ms = 2;
}

// ----------------------------------------------------------------- decisions

message SubscribeRequest {
  // Last sequence number the agent has applied; 0 = full snapshot.
  uint64 from_seq = 1;
}

enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  DECISION_KIND_BAN = 1;
  DECISION_KIND_UNBAN = 2;
  DECISION_KIND_ALLOW = 3;
}

message Decision {
  uint64 seq = 1;
  string id = 2;
  DecisionKind kind = 3;
  string target = 4;
  string jail = 5;
  int64 created_unix_ms = 6;
  // 0 = permanent
  int64 expires_unix_ms = 7;
  // For UNBAN: id of the revoked decision.
  string revokes = 8;
  // "agent:<id>", "correlation:<rule>" or "user:<name>"
  string origin = 9;
  string reason = 10;
}

message DecisionEvent {
  oneof event {
    // Sent first when the agent's from_seq is too old: replaces all state.
    Snapshot snapshot = 1;
    Decision decision = 2;
    // The complete central allowlist: sent after the snapshot/backlog and
    // whenever it changes. Replaces the previous one.
    AllowlistUpdate allowlist = 3;
    // Central jail settings for this agent (its group's merged with the
    // ones for all agents): sent after the allowlist and on every change.
    // Replaces the previous ones.
    JailPolicies jail_policies = 4;
    // Jails defined on the controller for this agent's group, with the
    // central filters they use: sent after the jail policies and on every
    // change. Replaces earlier ones.
    CentralJails central_jails = 5;
    // Redaction rules for sample log lines (all agents): sent after the
    // central jails and on every change. Replaces earlier ones.
    RedactionRules redaction = 6;
  }
}

message CentralJails {
  string version = 1;
  repeated CentralFilter filters = 2;
  repeated JailDefinition jails = 3;
}

message CentralFilter {
  string name = 1;
  // Filter definition in the agent's filter format (TOML).
  string toml = 2;
}

message JailDefinition {
  string name = 1;
  // A central filter of this message, else the agent's own filter file.
  string filter = 2;
  repeated SourceDefinition sources = 3;
  bool enabled = 4;
  uint32 maxretry = 5;
  int64 findtime_ms = 6;
  int64 bantime_ms = 7;
  double bantime_factor = 8;
  // 0 = no maximum
  int64 max_bantime_ms = 9;
}

message SourceDefinition {
  oneof kind {
    FileSource file = 1;
    JournaldSource journald = 2;
  }
}

message FileSource {
  repeated string paths = 1;
  bool start_at_end = 2;
}

message JournaldSource {
  repeated string matches = 1;
  // "tail" (default), "head" or a duration such as "10m"
  string start = 2;
}

message JailPolicies {
  string version = 1;
  repeated JailPolicy jails = 2;
}

// Overrides for a jail the agent defines; unset fields keep the agent's
// configuration. Unknown jails are ignored.
message JailPolicy {
  string jail = 1;
  optional bool enabled = 2;
  optional uint32 maxretry = 3;
  optional int64 findtime_ms = 4;
  optional int64 bantime_ms = 5;
  optional double bantime_factor = 6;
  optional int64 max_bantime_ms = 7;
}

message RedactionRules {
  // Content hash; the same rules always have the same version.
  string version = 1;
  // The enabled rules, applied in order after the agent's own.
  repeated RedactionRule rules = 2;
}

message RedactionRule {
  string name = 1;
  // Regular expression (Rust regex syntax).
  string pattern = 2;
  // Replacement; $1, ${name} refer to groups, $$ is a literal $.
  string replace = 3;
}

message AllowlistUpdate {
  // Content hash; the same list always has the same version.
  string version = 1;
  // Networks never to ban, e.g. "192.0.2.0/24".
  repeated string networks = 2;
  // Expiry per network (same order; 0 = permanent). Agents drop expired
  // entries themselves, also while disconnected. Empty: all permanent.
  repeated int64 expires_unix_ms = 3;
}

message Snapshot {
  uint64 seq = 1;
  repeated Decision active = 2;
}
