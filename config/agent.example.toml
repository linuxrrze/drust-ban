# dist-f2b agent configuration example.
# Validate with: df2b-agent --config agent.toml --check

[agent]
# Controller URL; omit for standalone mode. The first start needs a one-time
# enrollment token (df2b-controller enroll-token --group web):
#   df2b-agent --enroll-token df2b1.…   (or DF2B_ENROLL_TOKEN)
# The agent's key and certificate are then kept in <state_dir>/tls/; the
# group comes from the token. Without a reachable controller the agent keeps
# working standalone.
# controller = "https://df2b.example.org:7443"

# Prefix lengths used to aggregate offenders.
ipv4_prefix = 32
ipv6_prefix = 64

# Relative paths are resolved against this file's directory.
filter_dir = "../filters"
state_dir = "/var/lib/df2b"          # agent.redb: positions, offenders

# Keep offense history this long after a ban expired (ban-time escalation).
offense_memory = "30d"

# "nftables" or "dry-run"
firewall = "dry-run"

# Never ban these (CIDR notation).
allowlist = ["127.0.0.0/8", "::1/128"]

# Jails defined on the controller (Policies page, `df2bctl jails define`)
# run here too, with their log sources and filter. What this agent accepts:
# central_jails = true            # false: run local jails only
# central_paths = ["/var/log"]    # central file sources only below these
# central_journald = true         # central jails may read the journal
# A local jail with the same name always wins.

# With a controller: send the latest matching log line with the failure
# counts (shown on the address page). false: counts only, no log content
# leaves this host.
# send_samples = true

[[source]]
name = "sshd-journal"
type = "journald"
# journalctl-style matches; same field = OR, different fields = AND,
# "+" starts a new OR group. Filtering happens inside libsystemd.
matches = ["_SYSTEMD_UNIT=sshd.service", "_SYSTEMD_UNIT=ssh.service"]
# "tail" (default), "head", or a duration: start that long ago
start = "10m"
# directory = "/var/log/journal/<machine-id>"   # instead of the system journal

[[source]]
name = "auth-log"
type = "file"
paths = ["/var/log/auth.log"]
start_at_end = true

[[jail]]
name = "sshd"
sources = ["sshd-journal", "auth-log"]
filter = "sshd"
maxretry = 5
findtime = "10m"
bantime = "1h"
bantime_factor = 2.0
max_bantime = "30d"
